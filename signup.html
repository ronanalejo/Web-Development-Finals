<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SoleStealer</title>
        <link rel="stylesheet" href="css/signup.css">
        <link rel="icon" href="img/logo.png">
    </head>
<body>
    <img src="img/favicon.png" alt="Image" class="Logo">
    <h1>Welcome to SoleStealer</h1>
    <div class="form-container">
        <form id="signUpForm">
            <input type="text" id="newUsername" placeholder="Enter Username"> <br>
            <input type="password" id="newPassword" placeholder="Password"><br>
            <button type="submit">Sign Up</button>
            <br>
            <p>Have an account? <a href="login.html" class="login-link">Log In</a></p>
        </form>
    </div>
    <script src="js/signUp.js"></script>
</body>
</html>
